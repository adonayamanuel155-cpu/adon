<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FRAMES</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        .top {
            height: 20%;
            border: 1px solid black;
            box-sizing: border-box;
        }

        .bottom {
            display: grid;
            grid-template-columns: 10% 50% 40%;
            height: 80%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="top">
        <iframe src="top.html" title="Top section"></iframe>
    </div>

    <div class="bottom">
        <iframe src="top.html" title="First column"></iframe>
        <iframe src="top.html" title="Second column"></iframe>
        <iframe src="top.html" title="Third column"></iframe>
    </div>
</body>
</html>
