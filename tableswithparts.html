<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>newhtml5inputtypes</title>
</head>
<body>
    <h1>newhtml5inputtypesdemo</h1>
    <p>thisformdemonstratesthenewhtml5inputtypesandtheplacerequiredandautofocusattributes</p>

    <form method="post" action="http://www.deitel.com">
        <p><label>color: <input type="color" autofocus /></label></p>

        <p><label>date: <input type="date" /> (yyyy-mm-dd)</label></p>

        <p><label>email: <input type="email" placeholder="name@domain.com" /></label></p>

        <p><label>number: <input type="number" min="0" max="7" step="1" required /> (enter a number between 0 and 7)</label></p>

        <p><label>range: 0 <input type="range" min="0" max="20" value="10" /> 20</label></p>

        <p><label>search: <input type="search" placeholder="Enter your search query here" /></label></p>

        <p><label>url: <input type="url" placeholder="http://www.domainname.com" /></label></p>

        <p>
            <input type="submit" value="submit" />
            <input type="reset" value="clear" />
        </p>
    </form>
</body>
</html>
